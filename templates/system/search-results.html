  screenshotPath: ../../images/template-previews/search-results.png

{% set template_css = '../../css/templates/system.css' %}
{% extends '../layouts/base.html' %}

{% block body %}
<main id="main-content" class="body-container-wrapper">
  <section class="content-wrapper">
    
    <div class="container pb-4">
      <div class="row">
        <div class="col-md-12">
          <h1 class=" title title--h1 py-5">
            "{{ request.query_dict.term|escape }}"
          </h1>
          {% module 'search_result' path='../../modules/search_result' %}
        </div>
      </div>
    </div>

  </section>
</main>
{% endblock body %}
